services:
  db:
    image: postgres:17-alpine
    container_name: opsflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow
    ports:
      - "5432:5432"
    volumes:
      - opsflow_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow -d opsflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: opsflow-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://opsflow:opsflow@db:5432/opsflow
      JWT_SECRET: ${JWT_SECRET:-opsflow-docker-change-me}
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: opsflow-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://opsflow:opsflow@db:5432/opsflow
      JWT_SECRET: ${JWT_SECRET:-opsflow-docker-change-me}
    command: ["node", "apps/api/dist/seed.js"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  opsflow_pgdata:
