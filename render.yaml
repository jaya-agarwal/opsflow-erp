services:
  - type: web
    name: opsflow-api
    runtime: node
    buildCommand: buildCommand: npm install --include=dev && npm run build -w apps/api 
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
